---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: bazzite-noctalia
description: Bazzite gaming image with Umbriel, Noctalia Shell and Noctalia Greeter

base-image: ghcr.io/ublue-os/bazzite-gnome
image-version: stable

stages:
  - name: theme-builder
    from: registry.fedoraproject.org/fedora:44
    modules:
      # Native instructions copy only each pinned installer. Ordinary module
      # mounts include all /files, which would invalidate this cache on dot edits.
      - type: containerfile
        snippets:
          - |
            RUN dnf install -y --setopt=install_weak_deps=False \
                bash coreutils curl gzip sassc sed tar gtk-update-icon-cache zstd fontconfig && \
                dnf clean all
            COPY files/scripts/install-themes.sh /tmp/install-themes.sh
            RUN bash /tmp/install-themes.sh
            COPY files/scripts/install-overpass-nerd.sh /tmp/install-overpass-nerd.sh
            RUN bash /tmp/install-overpass-nerd.sh

  # Terra's nightly bot bumps only rawhide, so its F44 umbriel-nightly lags.
  # Rebuild the rawhide SRPM for F44; the main image keeps Terra's F44 build
  # whenever this stage produces nothing.
  - name: umbriel-builder
    from: registry.fedoraproject.org/fedora:44
    modules:
      - type: containerfile
        snippets:
          - |
            # Remote ADDs are fetched every build, so a new Terra snapshot or
            # Fedora update (wlroots) invalidates the cached rebuild.
            ADD https://repos.fyralabs.com/terrarawhide-source/repodata/repomd.xml /tmp/cache-keys/terra.xml
            ADD https://dl.fedoraproject.org/pub/fedora/linux/updates/44/Everything/x86_64/repodata/repomd.xml /tmp/cache-keys/fedora.xml
            COPY files/scripts/rebuild-umbriel-nightly.sh /tmp/rebuild-umbriel-nightly.sh
            RUN bash /tmp/rebuild-umbriel-nightly.sh /out

modules:
  # Fresh mutable RPM inputs on every build (including scheduled builds).
  # Only the isolated, pinned theme/font stage uses persistent cache hits.
  # Mark GTK portal and keyring as user-picked so autoremove keeps them.
  - type: dnf
    no-cache: true
    install:
      packages:
        - greetd
        - alacritty
        - xdg-desktop-portal-gtk
        - gnome-keyring
        # pam_gnome_keyring.so unlocks the login keyring through greetd. GDM
        # pulls this package in today, so removing GDM would let autoremove
        # drop it unless it is installed and marked user-selected here.
        - gnome-keyring-pam
        # Removing GNOME add-ons would also drop Nautilus.
        - nautilus
      exclude:
        # Noctalia supplies the bar, launcher, and lock screen.
        - swaylock
        - waybar
        - fuzzel

  # Terra ships disabled; turn it on only long enough to install its tools.
  - type: script
    snippets:
      - dnf5 config-manager setopt terra.enabled=1
      - dnf5 config-manager addrepo --from-repofile=https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo

  - type: dnf
    install:
      packages:
        - umbriel-nightly
        - noctalia
        - noctalia-greeter
        - xdg-desktop-portal-umbriel-nightly
        - ghostty
        - satty
        - brightnessctl
        - playerctl
        - inotify-tools
        # keyd ships ready to use but its service stays disabled; users opt in
        # with `systemctl enable --now keyd` and their own /etc/keyd config.
        - keyd
        # The screenshot tools call wl-copy, but no package pulls it in.
        - wl-clipboard
        # Smile's GNOME-only add-on cannot paste under Umbriel, so the wrapper
        # uses wtype.
        - wtype
        - pavucontrol
        - cava
        - brave-origin
        - seahorse
        - xterm
        - zsh
        - bat
        - micro
        - geany
        - ripgrep
        - stow
        - yazi
        - starship

  # Prefer the F44 rebuild of Terra's rawhide snapshot while Terra is enabled
  # to resolve its dependencies.
  - type: copy
    from: umbriel-builder
    src: /out
    dest: /tmp/umbriel-rebuild

  - type: script
    scripts:
      - install-rebuilt-umbriel.sh

  # Smile ships only on Flathub, so install it for each new user.
  - type: default-flatpaks
    configurations:
      - scope: user
        # The boot service sends two notices even when it has no work.
        notify: false
        install:
          - it.mijorus.smile

  # Nautilus needs localsearch, but its extractor crashes without GNOME.
  # Unit names change with tinysparql releases. Since systemctl cannot use a
  # glob, link every matching unit to /dev/null and keep plain filename search.
  - type: script
    snippets:
      - for u in /usr/lib/systemd/user/localsearch*.service; do ln -sf /dev/null "/etc/systemd/user/$(basename "$u")"; done

  - type: script
    scripts:
      - remove-gnome.sh

  - type: dnf
    install:
      packages:
        - overpass-fonts

  - type: files
    files:
      - source: system
        destination: /

  # Copy only generated artifacts out of the disposable build stage.
  - type: script
    snippets:
      - rm -rf /usr/share/themes/Graphite-purple-Dark-dracula /usr/share/icons/dracula-icons-main

  - type: copy
    from: theme-builder
    src: /usr/share/themes/Graphite-purple-Dark-dracula
    dest: /usr/share/themes/Graphite-purple-Dark-dracula

  - type: copy
    from: theme-builder
    src: /usr/share/icons/dracula-icons-main
    dest: /usr/share/icons/dracula-icons-main

  - type: copy
    from: theme-builder
    src: /usr/share/licenses/Graphite-gtk-theme
    dest: /usr/share/licenses/Graphite-gtk-theme

  - type: copy
    from: theme-builder
    src: /usr/share/licenses/dracula-icons
    dest: /usr/share/licenses/dracula-icons

  - type: copy
    from: theme-builder
    src: /usr/share/fonts/OTF/overpass-nerd
    dest: /usr/share/fonts/OTF/overpass-nerd

  - type: script
    snippets:
      - fc-cache -f /usr/share/fonts/OTF/overpass-nerd
    scripts:
      - setup-greetd.sh

  # These overrides name schemas or keys that GNOME cleanup removes. Drop them
  # before the strict check so any bad key left in this image fails the build.
  - type: script
    snippets:
      - rm -f /usr/share/glib-2.0/schemas/00_org.gnome.shell.gschema.override /usr/share/glib-2.0/schemas/org.gnome.shell.gschema.override /usr/share/glib-2.0/schemas/org.gnome.login-screen.gschema.override /usr/share/glib-2.0/schemas/10_org.gnome.desktop.screensaver.fedora.gschema.override /usr/share/glib-2.0/schemas/org.gnome.Ptyxis.fedora.gschema.override /usr/share/glib-2.0/schemas/zz0-0*.gschema.override
      - glib-compile-schemas --strict /usr/share/glib-2.0/schemas

  # Disable both repos in the shipped image; rebuilds supply package updates.
  - type: script
    snippets:
      - dnf5 config-manager setopt terra.enabled=0
      - dnf5 config-manager setopt brave-browser.enabled=0

  # Fail if upstream package changes restore GNOME or break Umbriel.
  - type: script
    scripts:
      - validate-package-set.sh
