[Service]
# The immutable image cannot ship /var. Initialize the greeter's mutable
# settings after tmpfiles has created its state directory on each boot.
Environment=GREETER_USER=greetd
ExecStartPre=/usr/bin/noctalia-greeter-apply-appearance --setup-system
ExecStartPre=/usr/bin/install -m 0640 -o greetd -g greetd /etc/noctalia-greeter/greeter.toml /var/lib/noctalia-greeter/greeter.toml
