# Starter configuration for bazzite-noctalia. Umbriel's native session starts
# through /usr/share/wayland-sessions/umbriel.desktop (Exec=start-umbriel).
[general]
autostart = ["noctalia", "$HOME/.local/bin/screenshot-notify.sh", "$HOME/.local/bin/umbriel-auto-fullwidth.py", "$HOME/.local/bin/umbriel-overview-autoclose.py"]
xwayland = true
xwayland_native_resolution = true
show_cheatsheet = false

[environment]
ELECTRON_OZONE_PLATFORM_HINT = "auto"
QT_QPA_PLATFORM = "wayland"
QT_QPA_PLATFORMTHEME = "gtk3"
QT_WAYLAND_DISABLE_WINDOWDECORATION = "1"
QSG_RENDER_LOOP = "threaded"

[appearance]
prefer_no_csd = true
border_width = 2
corner_radius = 20

[appearance.blur]
enabled = true
optimized = true
passes = 3
radius = 3

[colors.border]
focused = "#bd93f9"
unfocused = "#44475a"

[colors.overview]
background_tint = "#44475a"

[layout]
mode = "scrolling"
gap = 14
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 0.5
center_focused = "never"
center_underfull_strip = true

[workspaces]
back_and_forth = true

[overview]
zoom = 0.7

[animation.windows_in]
duration_ms = 200
curve = "easeout"

[animation.windows_out]
duration_ms = 200
curve = "easeout"

[animation.windows_move]
curve = "spring:1,800"

[animation.windows_drag]
physics = true

[animation.workspaces]
curve = "spring:1,1000"

[animation.overview]
curve = "spring:1,900"

[input.keyboard]
numlock_toggle = true

[input.touchpad]
tap = true
natural_scroll = true

[input.cursor]
theme = "Adwaita"
size = 24

[hot_corners.bottom_left]
enabled = true
action = "overview-toggle"

# Breezy's display identities and positions mirror the Niri dotfiles. An
# unmatched monitor still uses Umbriel's automatic preferred-mode layout.
[output."HP Inc. HP Z27q G3 CN41170Z70"]
mode = "2560x1440@59.951"
position = [0, 184]
scale = 1.0
focus_at_startup = true
workspaces = ["1", "2", "3"]

[output."HP Inc. HP Z27q G3 CN41170Z70".layout.scrolling]
default_extent_fraction = 0.5

[output."HP Inc. HP Z24n G3 CN41254B6B"]
mode = "1920x1200@59.950"
position = [2560, 0]
transform = "270"
scale = 1.0
workspaces = ["4", "5"]

[output."HP Inc. HP Z24n G3 CN41254B6B".layout.scrolling]
default_extent_fraction = 1.0

# Umbriel chooses the preferred mode on each connected display. Set per-output
# VRR and HDR only after confirming the output and GPU support:
# [output.DP-1]
# vrr = "fullscreen"
# hdr = "auto"

[keybinds]
"Mod+Return" = "spawn:alacritty"
"Super+Backslash" = "spawn:ghostty"
"Mod+B" = "spawn:brave-origin"
"Mod+E" = "spawn:nautilus"
"Mod+Period" = "spawn:$HOME/.local/bin/smile-paste.sh"
"Mod+Q" = "window-close"
"Mod+Shift+Q" = "spawn:noctalia msg panel-toggle session"
"Mod+Alt+L" = "spawn:loginctl lock-session"
"Mod+Space" = { action = "overview-toggle", repeat = false }
"Mod+S" = "spawn:noctalia msg panel-toggle launcher"
"Alt+Space" = "spawn:noctalia msg panel-toggle launcher"
"Mod+O" = "overview-toggle"
"Mod+F" = "window-toggle-fullscreen"
"Mod+T" = "window-toggle-floating"
"Mod+W" = "column-toggle-tabbed"
"Mod+C" = "column-center"
"Mod+H" = "window-focus-left"
"Mod+L" = "window-focus-right"
"Mod+K" = "window-focus-up"
"Mod+J" = "window-focus-down"
"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Up" = "window-focus-up"
"Mod+Down" = "window-focus-down"
"Mod+Ctrl+H" = "column-move-left"
"Mod+Ctrl+L" = "column-move-right"
"Mod+Ctrl+K" = "window-move-up"
"Mod+Ctrl+J" = "window-move-down"
"Mod+Ctrl+Left" = "column-move-left"
"Mod+Ctrl+Right" = "column-move-right"
"Mod+Ctrl+Up" = "window-move-up"
"Mod+Ctrl+Down" = "window-move-down"
"Mod+Home" = "column-focus-first"
"Mod+End" = "column-focus-last"
"Mod+Ctrl+Home" = "column-move-to-first"
"Mod+Ctrl+End" = "column-move-to-last"
"Mod+Shift+Left" = "output-focus-left"
"Mod+Shift+Right" = "output-focus-right"
"Mod+Shift+Up" = "output-focus-up"
"Mod+Shift+Down" = "output-focus-down"
"Mod+Ctrl+Shift+Left" = "column-move-to-output-left"
"Mod+Ctrl+Shift+Right" = "column-move-to-output-right"
"Mod+Ctrl+Shift+Up" = "column-move-to-output-up"
"Mod+Ctrl+Shift+Down" = "column-move-to-output-down"
"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+Ctrl+WheelUp" = { action = "column-move-to-workspace-previous", cooldown_ms = 150 }
"Mod+Ctrl+WheelDown" = { action = "column-move-to-workspace-next", cooldown_ms = 150 }
"Mod+WheelLeft" = "window-focus-left"
"Mod+WheelRight" = "window-focus-right"
"Mod+Ctrl+WheelLeft" = "column-move-left"
"Mod+Ctrl+WheelRight" = "column-move-right"
"Mod+Shift+WheelUp" = "window-focus-left"
"Mod+Shift+WheelDown" = "window-focus-right"
"Mod+Ctrl+Shift+WheelUp" = "column-move-left"
"Mod+Ctrl+Shift+WheelDown" = "column-move-right"
"Mod+Tab" = "workspace-focus-last"
"Mod+Ctrl+F" = "window-toggle-maximize"
"Mod+BracketLeft" = "window-consume-or-expel-left"
"Mod+BracketRight" = "window-consume-or-expel-right"
"Mod+Minus" = "window-modify-primary-extent:-0.1"
"Mod+Equal" = "window-modify-primary-extent:+0.1"
"Mod+Shift+Minus" = "window-modify-secondary-extent:-0.1"
"Mod+Shift+Equal" = "window-modify-secondary-extent:+0.1"
"Print" = "spawn:noctalia msg screenshot-region"
"Ctrl+Shift+2" = "spawn:noctalia msg screenshot-fullscreen pick"
# Noctalia v5 has no window-only screenshot command; select its region instead.
"Ctrl+Shift+3" = "spawn:noctalia msg screenshot-region"
"XF86AudioRaiseVolume" = { action = "spawn:noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:noctalia msg volume-mute", allow_when_locked = true }
"XF86AudioMicMute" = { action = "spawn:wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle", allow_when_locked = true }
"XF86AudioPlay" = { action = "spawn:playerctl play-pause", allow_when_locked = true }
"XF86AudioPause" = { action = "spawn:playerctl play-pause", allow_when_locked = true }
"XF86AudioNext" = { action = "spawn:playerctl next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn:playerctl previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn:noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:noctalia msg brightness-down", allow_when_locked = true }
"Mod+Shift+Escape" = "cheatsheet-toggle"
"Mod+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Ctrl+Alt+Delete" = "session-quit"
"Mod+Shift+P" = "dpms-off"

"Mod+1" = 'workspace-switch:"1"/DP-4'
"Mod+2" = 'workspace-switch:"2"/DP-4'
"Mod+3" = 'workspace-switch:"3"/DP-4'
"Mod+4" = 'workspace-switch:"4"/DP-3'
"Mod+5" = 'workspace-switch:"5"/DP-3'
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Ctrl+1" = 'column-move-to-workspace:"1"/DP-4'
"Mod+Ctrl+2" = 'column-move-to-workspace:"2"/DP-4'
"Mod+Ctrl+3" = 'column-move-to-workspace:"3"/DP-4'
"Mod+Ctrl+4" = 'column-move-to-workspace:"4"/DP-3'
"Mod+Ctrl+5" = 'column-move-to-workspace:"5"/DP-3'
"Mod+Ctrl+6" = "column-move-to-workspace:6"
"Mod+Ctrl+7" = "column-move-to-workspace:7"
"Mod+Ctrl+8" = "column-move-to-workspace:8"
"Mod+Ctrl+9" = "column-move-to-workspace:9"

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1080, height = 920 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.app_id = "^steam$"
match.title = "^(?![Ss]team$).+"
default_floating = true

[[window_rule]]
match.app_id = "^steam$"
match.title = "^notificationtoasts_.+_desktop$"
default_position = { x = 10, y = 10, anchor = "bottom_right" }
default_focused = false

[[window_rule]]
match.app_id = "([Gg]radia|[Ss]atty|it[.]mijorus[.]smile)"
default_floating = true

[[window_rule]]
match.app_id = "^hearthstone[.]exe$"
default_floating = true
default_maximize = true

[[window_rule]]
match.app_id = "^(hearthstonedecktracker|explorer)[.]exe$"
default_floating = true

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_optimized = false
