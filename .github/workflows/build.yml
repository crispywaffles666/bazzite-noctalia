name: bazzite-noctalia
on:
  schedule:
    - cron:
        "00 06 * * *" # Run 20 minutes after the last uBlue image starts.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  bluebuild:
    name: Build bazzite-noctalia
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # Let each recipe report its own result.
      matrix:
        recipe:
          - recipe.yml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup cosign for base verification
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2 # Legacy signatures; later versions auto-select unrelated OCI bundles

      - name: Test trust bootstrap
        run: python3 -m unittest discover -s tests -v

      - name: Resolve and verify the Bazzite base
        run: |
          base=$(bash scripts/verify-image.sh ghcr.io/ublue-os/bazzite-gnome stable keys/ublue-os.pub)
          # Recipe v1 resolves image-version to the template's immutable FROM.
          # Keep the verified digest even if upstream moves stable mid-build.
          sed -i "s/^image-version: stable$/image-version: stable@${base##*@}/" recipes/recipe.yml
          printf 'Verified Bazzite base: `%s`\n' "$base" >> "$GITHUB_STEP_SUMMARY"

      - name: Build Custom Image
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13.0
        with:
          recipe: ${{ matrix.recipe }}
          skip_checkout: true
          cli_version: v0.9.37
          verify_install: true
          use_cache: true
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # PRs get no repository secrets (forks) and a read-only token, so
          # they build and validate only. Only default-branch pushes and
          # schedules may publish and sign.
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          build_opts: ${{ (github.ref != 'refs/heads/main' || github.event_name == 'pull_request') && '--no-sign' || '' }}

          # Rechunk into content-defined layers for smaller delta updates:
          # the same rpm-ostree build-chunked-oci mechanism, layer cap, and
          # pre-push/sign placement as ublue-os/image-template's ostree-rechunk.
          build_chunked_oci: "true"
          max_layers: "127"

          # Small images can disable this to build faster.
          maximize_build_space: true

          # Retry registry pushes instead of rebuilding the whole image.
          retry_push_count: 3
